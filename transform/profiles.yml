job_market_pipeline:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Path is relative to the transform/ directory where dbt commands are run.
      # Locally this resolves to data/pipeline.duckdb — the same file that
      # medallion.py writes to. dbt opens it in read-write mode to create
      # the Gold tables.
      # Phase 4: swap this entire block for a BigQuery profile — models run unchanged.
      path: '../data/pipeline.duckdb'
      schema: main
      threads: 1
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: gold
      threads: 4
      timeout_seconds: 300
      priority: interactive
      retries: 1
